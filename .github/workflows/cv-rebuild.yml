name: CV Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/catalog.json'
      - 'docs/content/*.json'
      - 'cv/cv-data.json'
      - 'cv/perfil.jpg'
      - 'scripts/generate_cv.py'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (DejaVu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar fpdf2
        run: |
          pip install fpdf2

      - name: Generar CVs
        env:
          CV_NOMBRE_COMPLETO: ${{ secrets.CV_NOMBRE_COMPLETO }}
          CV_EDAD: ${{ secrets.CV_EDAD }}
          CV_FECHA_NACIMIENTO: ${{ secrets.CV_FECHA_NACIMIENTO }}
          CV_TELEFONO: ${{ secrets.CV_TELEFONO }}
          CV_DIRECCION: ${{ secrets.CV_DIRECCION }}
          CV_FACULTAD: ${{ secrets.CV_FACULTAD }}
          CV_REFERENCIAS: ${{ secrets.CV_REFERENCIAS }}
        run: |
          python scripts/generate_cv.py

      - name: Subir CVs públicos (pdf)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv/cv.es.pdf cv/cv.en.pdf
          if git diff --cached --quiet; then
            echo "Sin cambios en CVs públicos"
          else
            git commit -m "chore: regenerar CVs [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Enviar CV cubano a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          WEBHOOK="$DISCORD_WEBHOOK"
          FECHA=$(date -u +"%Y-%m-%d")
          curl -s -X POST "$WEBHOOK" \
            -F "content=CV cubano regenerado: $FECHA" \
            -F "files[0]=@cv/cv-cuba.pdf"