name: CV Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/catalog.json'
      - 'docs/content/*.json'
      - 'cv/cv-data.json'
      - 'cv/perfil.jpg'
      - 'scripts/generate_cv.py'

jobs:
  rebuild:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (DejaVu)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar fpdf2
        run: |
          pip install fpdf2

      - name: Generar CVs
        env:
          CV_NOMBRE_COMPLETO: ${{ secrets.CV_NOMBRE_COMPLETO }}
          CV_EDAD: ${{ secrets.CV_EDAD }}
          CV_FECHA_NACIMIENTO: ${{ secrets.CV_FECHA_NACIMIENTO }}
          CV_TELEFONO: ${{ secrets.CV_TELEFONO }}
          CV_DIRECCION: ${{ secrets.CV_DIRECCION }}
          CV_FACULTAD: ${{ secrets.CV_FACULTAD }}
          CV_REFERENCIAS: ${{ secrets.CV_REFERENCIAS }}
        run: |
          python scripts/generate_cv.py

      - name: Publicar CV español en release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f cv/cv.es.pdf ]; then
            echo "No existe cv.es.pdf. No se publica release."
            exit 0
          fi

          TAG="cv-es"
          TITULO="CV español (actualizado)"
          NOTAS="CV español generado automáticamente por el workflow CV Rebuild."

          # Borrar el release anterior si existe (y su tag)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Borrando release anterior: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          fi

          # Crear el release nuevo
          gh release create "$TAG" \
            --title "$TITULO" \
            --notes "$NOTAS" \
            --latest

          # Subir el PDF
          gh release upload "$TAG" cv/cv.es.pdf
          echo "Publicado: cv.es.pdf en el release $TAG"

      - name: Enviar CV cubano a Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ ! -f cv/cv-cuba.pdf ]; then
            echo "No existe cv/cv-cuba.pdf. No se envía a Discord."
            exit 0
          fi

          WEBHOOK="$DISCORD_WEBHOOK"
          FECHA=$(date -u +"%Y-%m-%d")
          curl -s -X POST "$WEBHOOK" \
            -F "content=CV cubano regenerado: $FECHA" \
            -F "files[0]=@cv/cv-cuba.pdf"