name: CV Rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/catalog.json'
      - 'docs/content/*.json'
      - 'cv/cv-data.json'
      - 'cv/perfil.jpg'

jobs:
  rebuild:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache MiKTeX
        uses: actions/cache@v4
        with:
          path: |
            C:\Program Files\MiKTeX
            C:\Users\runneradmin\AppData\Local\MiKTeX
            C:\Users\runneradmin\AppData\Roaming\MiKTeX
          key: miktex-${{ runner.os }}-v1
          restore-keys: |
            miktex-${{ runner.os }}-

      - name: Instalar MiKTeX y Pandoc
        shell: pwsh
        run: |
          # Pandoc
          choco install pandoc -y --no-progress

          # MiKTeX (si no está en caché)
          if (-not (Test-Path "C:\Program Files\MiKTeX\miktex\bin\x64\xelatex.exe")) {
            Write-Host "MiKTeX no encontrado. Instalando..."
            choco install miktex -y --no-progress
          } else {
            Write-Host "MiKTeX ya está instalado (desde caché)."
          }

          # Refrescar PATH
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")

          # Verificar que xelatex existe
          if (Test-Path "C:\Program Files\MiKTeX\miktex\bin\x64\xelatex.exe") {
            Write-Host "xelatex encontrado."
          } else {
            Write-Host "xelatex NO encontrado. Buscando..."
            Get-ChildItem -Path "C:\Program Files\MiKTeX" -Recurse -Filter "xelatex.exe" -ErrorAction SilentlyContinue | Select-Object FullName
          }

      - name: Generar CVs
        shell: pwsh
        env:
          CV_NOMBRE_COMPLETO: ${{ secrets.CV_NOMBRE_COMPLETO }}
          CV_EDAD: ${{ secrets.CV_EDAD }}
          CV_FECHA_NACIMIENTO: ${{ secrets.CV_FECHA_NACIMIENTO }}
          CV_TELEFONO: ${{ secrets.CV_TELEFONO }}
          CV_DIRECCION: ${{ secrets.CV_DIRECCION }}
          CV_FACULTAD: ${{ secrets.CV_FACULTAD }}
          CV_REFERENCIAS: ${{ secrets.CV_REFERENCIAS }}
        run: |
          ./scripts/generate-cv.ps1

      - name: Subir CVs públicos (md y pdf)
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv/cv.es.md cv/cv.es.pdf cv/cv.en.md cv/cv.en.pdf
          if (git diff --cached --quiet) {
            Write-Host "Sin cambios en CVs públicos"
          } else {
            git commit -m "chore: regenerar CVs [skip ci]"
            git pull --rebase origin main
            git push
          }

      - name: Enviar CV cubano a Discord
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          $webhook = $env:DISCORD_WEBHOOK
          $content = [System.IO.File]::ReadAllBytes("cv/cv-cuba.pdf")
          $boundary = [System.Guid]::NewGuid().ToString()
          $LF = "`r`n"

          $ms = New-Object System.IO.MemoryStream
          $writer = New-Object System.IO.StreamWriter($ms, [System.Text.UTF8Encoding]::new($false))
          $writer.NewLine = $LF

          $writer.WriteLine("--$boundary")
          $writer.WriteLine("Content-Disposition: form-data; name=`"content`"")
          $writer.WriteLine("")
          $writer.WriteLine("CV cubano regenerado: $((Get-Date).ToString('yyyy-MM-dd'))")
          $writer.WriteLine("--$boundary")
          $writer.WriteLine("Content-Disposition: form-data; name=`"file`"; filename=`"cv-cuba.pdf`"")
          $writer.WriteLine("Content-Type: application/pdf")
          $writer.WriteLine("")
          $writer.Flush()

          $ms.Write($content, 0, $content.Length)
          $ms.Flush()

          $writer.WriteLine("")
          $writer.WriteLine("--$boundary--")
          $writer.Flush()
          $writer.Dispose()

          $bytes = $ms.ToArray()
          $ms.Dispose()

          Invoke-RestMethod -Uri $webhook -Method Post -ContentType "multipart/form-data; boundary=$boundary" -Body $bytes