name: Build Catalog

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'scripts/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module -Name powershell-yaml -Scope CurrentUser -Force

      - name: Generate catalog.json
        shell: pwsh
        run: ./scripts/Generate-Catalog.ps1

      - name: Commit catalog.json if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json
          if (git diff --cached --quiet) {
            Write-Host "Sin cambios en catalog.json"
          } else {
            git commit -m "chore: regenerate catalog.json"
            git push
          }