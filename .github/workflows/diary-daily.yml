name: Diary Daily

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  daily-diary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Recopilar actividad del día
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          REPOS=(
            "Traeume-des-Blauen"
            "nexiria"
            "yozora-store-android"
            "Dibujama_Android"
            "dibujama"
            "converty"
            "baby-medina-android"
          )

          TODAY=$(date -u +"%Y-%m-%d")
          SINCE=$(date -u -d "24 hours ago" +"%Y-%m-%dT%H:%M:%SZ")

          echo "Consultando actividad desde $SINCE"

          TOTAL_COMMITS=0
          REPOS_ACTIVOS=""
          RELEASES_HOY=0
          ISSUES_NUEVOS=0
          ERRORES=""

          contar_elementos() {
            local url="$1"
            local etiqueta="$2"
            local respuesta

            respuesta=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$url" || echo -e "\n000")

            local codigo
            codigo=$(echo "$respuesta" | tail -n1)
            local cuerpo
            cuerpo=$(echo "$respuesta" | sed '$d')

            if [ "$codigo" = "404" ]; then
              echo "0"
              return
            fi

            if [ "$codigo" != "200" ]; then
              ERRORES="${ERRORES}\n• ${etiqueta}: HTTP ${codigo}"
              echo "0"
              return
            fi

            local tipo
            tipo=$(echo "$cuerpo" | jq -r 'type' 2>/dev/null || echo "unknown")

            if [ "$tipo" != "array" ]; then
              ERRORES="${ERRORES}\n• ${etiqueta}: respuesta no es array"
              echo "0"
              return
            fi

            echo "$cuerpo" | jq 'length' 2>/dev/null || echo "0"
          }

          for REPO in "${REPOS[@]}"; do
            echo "→ Revisando $REPO"

            COMMITS=$(contar_elementos \
              "https://api.github.com/repos/$OWNER/$REPO/commits?since=$SINCE&per_page=100" \
              "$REPO commits")

            RELEASES_RESP=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/releases?per_page=30" || echo -e "\n000")

            RELEASES_CODE=$(echo "$RELEASES_RESP" | tail -n1)
            RELEASES_BODY=$(echo "$RELEASES_RESP" | sed '$d')

            RELEASES=0
            if [ "$RELEASES_CODE" = "200" ]; then
              RELEASES=$(echo "$RELEASES_BODY" | jq --arg since "$SINCE" \
                '[.[] | select(.published_at > $since)] | length' 2>/dev/null || echo "0")
            elif [ "$RELEASES_CODE" != "404" ]; then
              ERRORES="${ERRORES}\n• $REPO releases: HTTP ${RELEASES_CODE}"
            fi

            ISSUES_RESP=$(curl -s -w "\n%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$OWNER/$REPO/issues?state=all&since=$SINCE&per_page=50" || echo -e "\n000")

            ISSUES_CODE=$(echo "$ISSUES_RESP" | tail -n1)
            ISSUES_BODY=$(echo "$ISSUES_RESP" | sed '$d')

            ISSUES=0
            if [ "$ISSUES_CODE" = "200" ]; then
              ISSUES=$(echo "$ISSUES_BODY" | jq --arg since "$SINCE" \
                '[.[] | select(.created_at > $since) | select(.pull_request == null)] | length' \
                2>/dev/null || echo "0")
            elif [ "$ISSUES_CODE" != "404" ]; then
              ERRORES="${ERRORES}\n• $REPO issues: HTTP ${ISSUES_CODE}"
            fi

            TOTAL_COMMITS=$((TOTAL_COMMITS + COMMITS))
            RELEASES_HOY=$((RELEASES_HOY + RELEASES))
            ISSUES_NUEVOS=$((ISSUES_NUEVOS + ISSUES))

            if [ "$COMMITS" -gt 0 ]; then
              REPOS_ACTIVOS="${REPOS_ACTIVOS}\n• \`${REPO}\`: ${COMMITS} commit(s)"
            fi
          done

          echo "Total commits: $TOTAL_COMMITS"

          # LÓGICA DE RACHA
          STREAK_JSON=$(curl -s -H "Authorization: Bearer $GIST_TOKEN" \
            "https://api.github.com/gists/$GIST_ID" \
            | jq -r '.files["streak.json"].content // "{\"current\":0,\"last_date\":\"\"}"')

          STREAK_CURRENT=$(echo "$STREAK_JSON" | jq -r '.current // 0')
          STREAK_LAST=$(echo "$STREAK_JSON" | jq -r '.last_date // ""')

          YESTERDAY=$(date -u -d "yesterday" +"%Y-%m-%d")

          if [ "$TOTAL_COMMITS" -gt 0 ]; then
            if [ "$STREAK_LAST" = "$YESTERDAY" ]; then
              STREAK_CURRENT=$((STREAK_CURRENT + 1))
            elif [ "$STREAK_LAST" = "$TODAY" ]; then
              :
            else
              STREAK_CURRENT=1
            fi
          else
            STREAK_CURRENT=0
          fi

          STREAK_LAST="$TODAY"

          STREAK_PAYLOAD=$(jq -n \
            --argjson current "$STREAK_CURRENT" \
            --arg last "$STREAK_LAST" \
            '{current: $current, last_date: $last}')

          curl -s -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$STREAK_PAYLOAD" '{files: {"streak.json": {content: $content}}}')" \
            "https://api.github.com/gists/$GIST_ID" > /dev/null

          # GUARDAR DATOS PARA EL NARRATIVO
          DIARY_PAYLOAD=$(jq -n \
            --argjson commits "$TOTAL_COMMITS" \
            --argjson releases "$RELEASES_HOY" \
            --argjson issues "$ISSUES_NUEVOS" \
            --arg repos "$REPOS_ACTIVOS" \
            '{commits: $commits, releases: $releases, issues: $issues, repos: $repos}')

          curl -s -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$DIARY_PAYLOAD" '{files: {"dev_diary_data.json": {content: $content}}}')" \
            "https://api.github.com/gists/$GIST_ID" > /dev/null

          # CONSTRUIR MENSAJE con printf (saltos reales)
          if [ "$TOTAL_COMMITS" -gt 0 ] || [ "$RELEASES_HOY" -gt 0 ] || [ "$ISSUES_NUEVOS" -gt 0 ]; then
            MSG=$(printf '📓 **Diario del desarrollador — %s**\n' "$TODAY")
            MSG+=$(printf '• **%d** commit(s) en total' "$TOTAL_COMMITS")
            if [ -n "$REPOS_ACTIVOS" ]; then
              MSG+=$(printf '\n• Repos con actividad:%b' "$REPOS_ACTIVOS")
            fi
            if [ "$RELEASES_HOY" -gt 0 ]; then
              MSG+=$(printf '\n• **%d** release(s) publicado(s)' "$RELEASES_HOY")
            fi
            if [ "$ISSUES_NUEVOS" -gt 0 ]; then
              MSG+=$(printf '\n• **%d** issue(s) nuevo(s)' "$ISSUES_NUEVOS")
            fi
            MSG+=$(printf '\n\nMañana más. 💙')
          else
            COMENTARIOS=(
              "Hoy no hubo movimiento. Supongo que descansaste. Bien por ti. 💙"
              "Día tranquilo. A veces hace falta. 💙"
              "Nada por aquí. El silencio también cuenta. 💙"
              "Sin actividad hoy. Mañana será otro día. 💙"
            )
            RANDOM_INDEX=$((RANDOM % ${#COMENTARIOS[@]}))
            MSG=$(printf '📓 **Diario del desarrollador — %s**\n\n%s' "$TODAY" "${COMENTARIOS[$RANDOM_INDEX]}")
          fi

          if [ "$STREAK_CURRENT" -gt 0 ]; then
            if [ "$STREAK_CURRENT" -eq 1 ]; then
              MSG+=$(printf '\n\n🔥 Racha: **1 día**. ¡A por más!')
            else
              MSG+=$(printf '\n\n🔥 Racha: **%d días seguidos**. ¡No la rompas!' "$STREAK_CURRENT")
            fi
          else
            MSG+=$(printf '\n\n💔 Racha rota. Vuelve a empezar.')
          fi

          if [ -n "$ERRORES" ]; then
            MSG+=$(printf '\n\n⚠️ **Avisos de la API:**%b' "$ERRORES")
          fi

          PAYLOAD=$(jq -n --arg content "$MSG" '{content: $content}')
          curl -s -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"
          echo "Diario enviado."