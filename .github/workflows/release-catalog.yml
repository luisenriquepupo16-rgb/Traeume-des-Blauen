name: Release Catalog

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
  workflow_dispatch:

jobs:
  release-apps:
    name: Create/Update GitHub Releases
    runs-on: windows-latest
    permissions:
      contents: write

    outputs:
      changed_apps: ${{ steps.detect.outputs.changed_apps }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module -Name powershell-yaml -Scope CurrentUser -Force

      - name: Detect changed apps
        id: detect
        shell: pwsh
        run: |
          # Obtener archivos cambiados en el último commit
          $changed = git diff --name-only HEAD~1 HEAD
          $appIds = @()
          foreach ($file in $changed) {
            if ($file -match '^apps/([^/]+)/') {
              $appIds += $Matches[1]
            }
          }
          $appIds = $appIds | Sort-Object -Unique
          Write-Host "Apps cambiadas: $($appIds -join ', ')"
          $json = $appIds | ConvertTo-Json -Compress
          if ($appIds.Count -eq 0) { $json = '[]' }
          "changed_apps=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create releases for changed apps
        if: steps.detect.outputs.changed_apps != '[]'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $appIds = '${{ steps.detect.outputs.changed_apps }}' | ConvertFrom-Json
          foreach ($appId in $appIds) {
            Write-Host "`n=== Procesando $appId ===" -ForegroundColor Cyan

            $appDir = "apps/$appId"
            $infoPath = "$appDir/info.md"
            if (-not (Test-Path $infoPath)) {
              Write-Warning "No hay info.md en $appDir"
              continue
            }

            # Leer frontmatter para obtener la version
            $bytes = [System.IO.File]::ReadAllBytes($infoPath)
            $content = [System.Text.Encoding]::UTF8.GetString($bytes)
            if ($content -notmatch '(?s)^\s*---\s*\r?\n(.*?)\r?\n---\s*\r?\n(.*)$') {
              Write-Warning "Frontmatter invalido en $infoPath"
              continue
            }
            $meta = ConvertFrom-Yaml $Matches[1]
            $version = $meta.version
            $appName = $meta.name

            $tag = "${appId}_v$version"
            Write-Host "Tag: $tag"

            # Buscar APK
            $apk = Get-ChildItem -Path $appDir -Filter "*.apk" | Select-Object -First 1
            if (-not $apk) {
              Write-Warning "No hay APK en $appDir"
              continue
            }

            # Obtener tag anterior (si existe) para sacar los commits entre versiones
            $prevTag = $null
            try {
              $prevTag = gh release list --limit 100 --json tagName --jq ".[] | select(.tagName | startswith(`"$appId`_v`")) | .tagName" 2>$null | Select-Object -First 1
            } catch { }
            if ($prevTag) {
              Write-Host "Tag anterior: $prevTag"
            } else {
              Write-Host "No hay tag anterior para esta app."
            }

            # Obtener commits entre tags (o todos los commits si no hay tag anterior)
            $commitRange = if ($prevTag) { "$prevTag..$tag" } else { "HEAD" }
            $commits = git log --pretty=format:"%s" $commitRange 2>$null
            $commitText = ($commits -join "`n").Trim()

            if ([string]::IsNullOrWhiteSpace($commitText)) {
              $commitText = "No hay commits nuevos para esta versión."
            }

            # Construir prompt para Gemini
            $prompt = @"
Eres un asistente que escribe notas de release profesionales para una aplicación Android llamada "$appName".

A continuación se muestran los mensajes de commit (en bruto) entre la versión anterior y la nueva versión $version:

$commitText

Tu tarea:
1. Reescribe estos mensajes en notas de release limpias, profesionales y bien redactadas, en español.
2. Agrupa los cambios por tipo: "Nuevas funcionalidades", "Correcciones" y "Mejoras".
3. No inventes características que no estén en los commits.
4. Si un commit es ambiguo o no aporta información, omítelo.
5. El resultado debe ser un texto en Markdown, listo para pegar en GitHub Releases.

Notas de release:
"@

            # Llamar a Gemini 3.8 Flash
            $notes = "Release automático de $appName versión $version"
            if ($env:GEMINI_API_KEY) {
              try {
                $geminiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=$env:GEMINI_API_KEY"
                $body = @{
                  contents = @(
                    @{
                      parts = @(
                        @{ text = $prompt }
                      )
                    }
                  )
                } | ConvertTo-Json -Depth 10

                $response = Invoke-RestMethod -Uri $geminiUrl -Method Post -Body $body -ContentType "application/json" -TimeoutSec 60
                $candidate = $response.candidates[0].content.parts[0].text
                if (-not [string]::IsNullOrWhiteSpace($candidate)) {
                  $notes = $candidate.Trim()
                  Write-Host "Notas de release generadas por Gemini." -ForegroundColor Green
                } else {
                  Write-Warning "Gemini devolvió una respuesta vacía. Usando fallback."
                }
              } catch {
                Write-Warning "Error al llamar a Gemini: $($_.Exception.Message). Usando fallback."
              }
            } else {
              Write-Warning "No hay GEMINI_API_KEY configurada. Usando fallback."
            }

            # Ver si el release ya existe
            $existing = gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Release $tag ya existe. Eliminando para recrear..." -ForegroundColor Yellow
              gh release delete $tag --yes --cleanup-tag
            }

            # Crear release y subir assets
            Write-Host "Creando release $tag..."
            $releaseArgs = @(
              "release", "create", $tag,
              "--title", "$appName $version",
              "--notes", $notes,
              "--latest"
            )

            # Assets: APK + icono si existe
            $assets = @($apk.FullName)
            $iconPath = "$appDir/icon.png"
            if (Test-Path $iconPath) {
              $assets += (Resolve-Path $iconPath).Path
            }

            gh @releaseArgs @assets

            if ($LASTEXITCODE -ne 0) {
              throw "Fallo al crear el release $tag"
            }

            Write-Host "Release $tag creado con $($assets.Count) assets." -ForegroundColor Green
          }

  build-catalog:
    name: Regenerate catalog.json
    needs: release-apps
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module -Name powershell-yaml -Scope CurrentUser -Force

      - name: Generate catalog.json
        shell: pwsh
        run: ./scripts/Generate-Catalog.ps1

      - name: Commit catalog.json if changed
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.json -f
          if (git diff --cached --quiet) {
            Write-Host "Sin cambios en catalog.json"
          } else {
            git commit -m "chore: regenerate catalog.json [skip ci]"
            git push
          }